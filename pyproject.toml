[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "holdout-ledger"
version = "0.1.0"
description = "Explain dataset leakage, preserve holdouts, and review fingerprint-bound repairs"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Seyyed Arad Hosseini Moghaddam"}]
dependencies = ["pydantic>=2.10,<3", "datasketch>=2.0,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "httpx>=0.27,<1", "ruff>=0.9,<1", "mypy>=1.14,<2", "build>=1.2,<2"]
hf = ["datasets>=4,<6"]

[project.scripts]
holdout-ledger = "holdout_ledger.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
holdout_ledger = ["static/*.html", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["datasketch.*", "datasets.*"]
ignore_missing_imports = true
